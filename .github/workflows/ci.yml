name: CI - Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build common-lib
        run: mvn -f common-lib/pom.xml clean install -DskipTests

      - name: Build security-lib
        run: mvn -f security-lib/pom.xml clean install -DskipTests

      - name: Build all services
        run: |
          for service in profile-service virtual-account-service charge-service \
                         transfer-service ledger-service notification-service; do
            echo "Building $service..."
            mvn -f $service/pom.xml clean package -DskipTests
          done

      - name: Build Docker images (verify only, no push)
        run: |
          for service in profile-service virtual-account-service charge-service \
                         transfer-service ledger-service notification-service; do
            docker build -f $service/Dockerfile -t $service:test .
          done