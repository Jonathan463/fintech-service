version: '3.8'

services:
  postgres:
    image: postgres:17.2-alpine
    container_name: ledger-service-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledger-service}
      POSTGRES_USER: ${POSTGRES_USER:-ledger-service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger-service}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger-service -d ledger-service"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledger-service-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-service-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ledger-service}
      DB_USERNAME: ${DB_USERNAME:-ledger-service}
      DB_PASSWORD: ${DB_PASSWORD:-ledger-service}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092}
      SERVICES_PROFILE_SERVICE_BASE_URL: ${PROFILE_SERVICE_URL:-http://localhost:8080}
    ports:
      - "8085:8085"
    networks:
      - ledger-service-network

volumes:
  postgres_data:

networks:
  ledger-service-network:
    driver: bridge
